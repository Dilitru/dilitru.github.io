<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nike - Slot Machine</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">

  <style>
    * { font-family: "Plus Jakarta Sans", system-ui, sans-serif }

    @keyframes scrollVertical {
      0% { transform: translateY(0) }
      100% { transform: translateY(-1000px) }
    }

    @keyframes jackpotPop {
      0% { transform: translate(-50%, -50%) scale(.6); opacity: 0 }
      30% { transform: translate(-50%, -50%) scale(1.08); opacity: 1 }
      50% { transform: translate(-50%, -50%) scale(.96) }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1 }
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1 }
      100% { transform: translateY(110vh) rotate(720deg) scale(.6); opacity: 0 }
    }

    .reel-bounce { transition: transform .64s cubic-bezier(.34,1.56,.64,1) }
    .reel-spinning { animation: scrollVertical .48s linear infinite }

    :root {
      /* ===== EDIT THESE COLORS ===== */
      --app-bg: #ffffff;       /* app window bg, not whole site */
      --spin-bg: #111111;      /* spin button bg - black */
      --spin-text: #ffffff;    /* spin button text - white */
      --spin-shadow: rgba(0,0,0,0.28);
      --payline: #111111;      /* middle line - black */
    }

    .bg-fallback { background-color: #ffffff; }
  </style>
</head>

<body id="pageBody" class="min-h-screen flex items-center justify-center p-4 overflow-hidden relative bg-fallback">

  <!-- Background layer -->
  <div id="bgLayer" class="pointer-events-none absolute inset-0">
    <div id="bgFallback" class="absolute inset-0">
      <div class="absolute -top-[10%] right-[-6%] w-[68%] max-w-[620px] h-[52%] bg-[#e9ecef] rounded-[60%_40%_50%_50%/60%_50%_50%_40%] opacity-90 rotate-[-6deg]"></div>
      <div class="absolute top-[14%] right-[18%] w-[180px] h-[180px] bg-white rounded-full shadow-[0_20px_60px_rgba(0,0,0,0.04)] opacity-70"></div>
      <div class="absolute -bottom-[12%] left-[-6%] w-[68%] max-w-[620px] h-[48%] bg-[#eef1f3] rounded-[40%_60%_60%_40%/60%_40%_40%_60%] opacity-90"></div>
    </div>
    <img id="bgImage" class="absolute inset-0 w-full h-full object-cover hidden" alt="background" />
  </div>

  <!-- Full-screen confetti - always on top of YOU WIN -->
  <div id="globalConfetti" class="pointer-events-none fixed inset-0 z-[100] overflow-hidden"></div>

  <!-- App: scale + origin-center = zoom without pushing down -->
  <div id="app" class="relative z-10 w-full max-w-[400px] flex flex-col items-center scale-[1.3] origin-center"></div>


<script>
/* =========================================================
   ASSETS - change paths if needed
   ========================================================= */
const ASSETS = {
  background: "assets/background.jpg",
  frame: "assets/frame.png",
  logo: "assets/logo.png",
  jackpot: "assets/jackpot.png",
  icons: [
    "assets/icon-0.png", "assets/icon-1.png", "assets/icon-2.png",
    "assets/icon-3.png", "assets/icon-4.png", "assets/icon-5.png",
    "assets/icon-6.png", "assets/icon-7.png", "assets/icon-8.png",
    "assets/icon-9.png",
  ]
};

const FALLBACK_ICONS = [
  { e: '🍒' }, { e: '🍋' }, { e: '🔔' }, { e: '🍀' }, { e: '💎' },
  { e: '7️⃣' }, { e: '⭐' }, { e: '🍉' }, { e: '👑' }, { e: '💰' }
];

/* =========================================================
   Loading state
   ========================================================= */
let bgLoaded = false;
let frameLoaded = false;
let logoLoaded = false;
let jackpotLoaded = false;
let iconLoaded = Array(10).fill(false);

function tryLoadImage(src, onOk, onFail) {
  const img = new Image();
  img.onload = onOk;
  img.onerror = onFail;
  img.src = src + "?v=" + Date.now();
}

tryLoadImage(ASSETS.background, () => {
  bgLoaded = true;
  const bgImg = document.getElementById('bgImage');
  const bgFall = document.getElementById('bgFallback');
  bgImg.src = ASSETS.background;
  bgImg.classList.remove('hidden');
  bgFall.classList.add('hidden');
  document.getElementById('pageBody').classList.remove('bg-fallback');
}, () => {});

tryLoadImage(ASSETS.frame, () => { frameLoaded = true; render(); }, () => {});
tryLoadImage(ASSETS.logo, () => { logoLoaded = true; render(); }, () => {});
tryLoadImage(ASSETS.jackpot, () => { jackpotLoaded = true; render(); }, () => {});

ASSETS.icons.forEach((src, i) => {
  tryLoadImage(src, () => { iconLoaded[i] = true; render(); }, () => {});
});


/* =========================================================
   AUDIO - Web Audio API, no mp3 files needed
   ========================================================= */
let audioCtx = null;
let tickInterval = null;

function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function tone(freq, duration, type = 'sine', volume = 0.25) {
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function clickSfx() {
  tone(900, 0.08, 'square', 0.12);
}

function thunkSfx() {
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.18);

    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.22);

    setTimeout(() => tone(1200, 0.05, 'triangle', 0.12), 10);
  } catch (e) {}
}

function startTickLoop() {
  stopTickLoop();

  let speed = 70;
  tickInterval = setInterval(() => {
    tone(1800 + Math.random() * 400, 0.04, 'square', 0.06);
  }, speed);

  let counter = 0;
  const slowDown = setInterval(() => {
    counter++;
    if (tickInterval) {
      clearInterval(tickInterval);
      speed = Math.min(140, 70 + counter * 4);
      tickInterval = setInterval(() => {
        tone(1800 + Math.random() * 400, 0.04, 'square', 0.06);
      }, speed);
    }
    if (!isSpinning) {
      clearInterval(slowDown);
      stopTickLoop();
    }
  }, 120);

  tickInterval._slow = slowDown;
}

function stopTickLoop() {
  if (tickInterval) {
    clearInterval(tickInterval);
    if (tickInterval._slow) clearInterval(tickInterval._slow);
    tickInterval = null;
  }
}

function winJingle() {
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    setTimeout(() => tone(freq, 0.35, 'triangle', 0.28), i * 120);
  });
  setTimeout(() => tone(1318.5, 0.6, 'triangle', 0.32), 500);
}

function loseSfx() {
  tone(220, 0.2, 'sine', 0.18);
}


/* =========================================================
   GAME STATE
   ========================================================= */
const ICON_H = 100;
const VIEW_H = 240;
const CENTER_OFFSET = VIEW_H / 2 - ICON_H / 2;

let X = 5;                 // spins needed to win
let totalSpins = 0;        // resets to 0 on win
let spinning = [false, false, false];
let positions = [0, 0, 0];
let isSpinning = false;
let hasWon = false;
let toastTimer = null;


/* =========================================================
   RENDER HELPERS - broken into small readable functions
   ========================================================= */
function renderIconContent(index) {
  const src = ASSETS.icons[index];

  if (iconLoaded[index]) {
    return `
      <img
        src="${src}"
        class="w-[68px] h-[68px] object-contain"
        draggable="false"
        onerror="iconLoaded[${index}]=false; render();"
      />
    `;
  }

  return `<span class="text-[36px]">${FALLBACK_ICONS[index].e}</span>`;
}

function renderSingleReel(reelIndex) {
  const strip = [...Array(10).keys(), ...Array(10).keys()];
  const translate = spinning[reelIndex]
    ? ''
    : `translateY(${-positions[reelIndex] * ICON_H + CENTER_OFFSET}px)`;

  const reelClass = spinning[reelIndex] ? 'reel-spinning' : 'reel-bounce';
  const style = spinning[reelIndex] ? '' : `transform:${translate}`;

  const cells = strip.map(iconIdx => `
    <div class="flex h-[100px] w-[100px] shrink-0 items-center justify-center select-none bg-white border-b border-zinc-100">
      ${renderIconContent(iconIdx)}
    </div>
  `).join('');

  return `
    <div class="relative w-[100px] h-[240px] overflow-hidden rounded-[16px] bg-white border border-zinc-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
      <div class="${reelClass} flex flex-col will-change-transform" style="${style}">
        ${cells}
      </div>
      <div class="pointer-events-none absolute inset-x-0 top-0 h-[72px] bg-gradient-to-b from-white via-white/90 to-transparent z-10"></div>
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-[72px] bg-gradient-to-t from-white via-white/90 to-transparent z-10"></div>
    </div>
  `;
}

function renderLogo() {
  if (logoLoaded) {
    return `
      <img
        src="${ASSETS.logo}"
        class="h-[84px] md:h-[108px] max-w-[340px] w-auto object-contain"
        style="transform:scale(1.15)"
        alt="logo"
        onerror="logoLoaded=false; render();"
      />
    `;
  }

  return `
    <div class="flex h-[72px] w-[320px] items-center justify-center rounded-2xl border border-dashed border-zinc-300/60 text-[11px] font-bold tracking-[0.2em] text-zinc-400/80 select-none bg-transparent">
      YOUR LOGO HERE
    </div>
  `;
}

function renderJackpot(paylineColor) {
  if (!hasWon) return '';

  const jackpotContent = jackpotLoaded
    ? `<img src="${ASSETS.jackpot}" class="max-w-[420px] max-h-[240px] w-[90vw] object-contain drop-shadow-[0_12px_32px_rgba(0,0,0,0.4)]" alt="YOU WIN" onerror="jackpotLoaded=false; render();" />`
    : `<div class="whitespace-nowrap rounded-full px-10 py-4 text-[36px] md:text-[44px] font-[800] tracking-[0.02em] text-white shadow-[0_12px_32px_rgba(0,0,0,0.45)] border border-white/10" style="background:${paylineColor}">YOU WIN!</div>`;

  return `
    <div class="pointer-events-none absolute inset-0 z-20 rounded-[16px]" style="background:radial-gradient(ellipse at center, ${paylineColor}1a, transparent 70%)"></div>
    <div class="absolute left-1/2 top-1/2 z-40 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="animation:jackpotPop .62s cubic-bezier(.34,1.56,.64,1) forwards">
      ${jackpotContent}
    </div>
  `;
}

function renderConfetti() {
  if (!hasWon) return;

  const confettiEl = document.getElementById('globalConfetti');
  if (!confettiEl) return;

  const colors = ['#111111', '#ffffff', '#ff6900', '#e5e7eb', '#a3a3a3'];
  let html = '';

  for (let i = 0; i < 90; i++) {
    const left = Math.random() * 100;
    const delay = Math.random() * 0.4;
    const duration = 2.2 + Math.random() * 1.2;
    const w = 6 + Math.random() * 6;
    const h = 8 + Math.random() * 10;
    const rot = Math.random() * 720;

    html += `
      <div
        class="absolute rounded-[2px]"
        style="
          left:${left}%;
          top:-20px;
          width:${w}px;
          height:${h}px;
          background:${colors[i % colors.length]};
          animation:confettiFall ${duration}s cubic-bezier(.25,.46,.45,.94) forwards;
          animation-delay:${delay}s;
          transform:rotate(${rot}deg)
        "
      ></div>
    `;
  }

  confettiEl.innerHTML = html;

  // Clear after 3s
  setTimeout(() => {
    if (confettiEl) confettiEl.innerHTML = '';
  }, 3000);
}


/* =========================================================
   MAIN RENDER
   ========================================================= */
function render() {
  const app = document.getElementById('app');

  // Read editable colors
  const appBg = getComputedStyle(document.documentElement)
    .getPropertyValue('--app-bg').trim() || '#ffffff';

  const paylineColor = getComputedStyle(document.documentElement)
    .getPropertyValue('--payline').trim() || '#111111';

  // Frame logic
  const frameStyle = frameLoaded
    ? `background-image:url('${ASSETS.frame}'); background-size:100% 100%; background-repeat:no-repeat; background-color:transparent; border:none; box-shadow:none;`
    : `background:${appBg};`;

  const frameClass = frameLoaded
    ? 'bg-transparent'
    : 'border border-black/[0.06] shadow-[0_10px_40px_rgba(0,0,0,0.08)]';

  // Reels
  const reelsHtml = [0, 1, 2]
    .map(i => renderSingleReel(i))
    .join('');

  // Build final HTML
  app.innerHTML = `
    <div class="relative w-full rounded-[32px] ${frameClass} p-[10px] md:p-[12px] pt-[6px] md:pt-[8px]" style="${frameStyle}">

      ${frameLoaded ? `<div class="absolute inset-0 rounded-[32px] -z-10" style="background:${appBg}; opacity:0.85"></div>` : ''}

      <!-- LOGO - bigger now, less padding -->
      <div class="relative flex min-h-[48px] items-center justify-center rounded-[16px] bg-transparent py-[2px]">
        ${renderLogo()}

        <!-- Secret buttons (almost invisible) -->
        <button onclick="changeX(-1)" title="S1" class="absolute left-[6px] top-1/2 -translate-y-1/2 h-[12px] w-[12px] rounded-full bg-zinc-300 opacity-[0.18] hover:opacity-[0.7] hover:bg-zinc-400 active:scale-90 z-20"></button>
        <button onclick="changeX(1)" title="S2" class="absolute right-[6px] top-1/2 -translate-y-1/2 h-[12px] w-[12px] rounded-full bg-zinc-300 opacity-[0.18] hover:opacity-[0.7] hover:bg-zinc-400 active:scale-90 z-20"></button>
      </div>

      <!-- Toast -->
      <div id="toast" class="pointer-events-none absolute left-1/2 top-[18px] z-30 -translate-x-1/2 whitespace-nowrap rounded-full border border-black/[0.06] bg-white px-4 py-[9px] text-[11px] font-medium text-zinc-700 shadow-[0_8px_24px_rgba(0,0,0,0.08)] hidden">
        <span class="mr-2 inline-block h-[6px] w-[6px] rounded-full" style="background:${paylineColor}"></span>
        <span id="toastText"></span>
      </div>

      <!-- REELS -->
      <div class="mt-[6px] rounded-[24px] border border-black/[0.03] p-[12px]" style="background:${appBg === '#ffffff' ? '#f5f7f9' : appBg}ee;">
        <div class="relative flex justify-center gap-[10px] rounded-[16px] py-[6px]">

          <!-- Payline -->
          <div class="pointer-events-none absolute left-[2px] right-[2px] top-1/2 z-20 h-[2px] -translate-y-1/2" style="background:${paylineColor}; box-shadow:0 0 12px ${paylineColor}55"></div>
          <div class="pointer-events-none absolute left-[2px] right-[2px] top-1/2 z-20 h-[28px] -translate-y-1/2 blur-[1px]" style="background:${paylineColor}0f;"></div>

          ${reelsHtml}
          ${renderJackpot(paylineColor)}

        </div>
      </div>

      <!-- SPIN BUTTON -->
      <div class="mt-[18px] flex flex-col items-center pb-[4px]">
        <button
          id="spinBtn"
          onclick="spin()"
          ${isSpinning ? 'disabled' : ''}
          class="relative h-[52px] w-[168px] select-none rounded-full text-[14px] font-[800] tracking-[0.14em] outline-none transition-all ${isSpinning ? 'opacity-70 cursor-not-allowed' : 'active:scale-[0.98] hover:brightness-[1.08] cursor-pointer'}"
          style="background:var(--spin-bg); color:var(--spin-text); box-shadow:0 6px 16px var(--spin-shadow), 0 1px 0 rgba(255,255,255,0.15) inset"
        >
          ${isSpinning ? 'SPINNING...' : 'SPIN'}
        </button>
      </div>

    </div>
  `;

  renderConfetti();
}


/* =========================================================
   INTERACTIONS
   ========================================================= */
function showToast(message) {
  const toast = document.getElementById('toast');
  const text = document.getElementById('toastText');
  if (!toast) return;

  text.textContent = message;
  toast.classList.remove('hidden');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.add('hidden');
  }, 3000);
}

function changeX(delta) {
  try { getCtx().resume(); } catch (e) {}
  clickSfx();

  X = Math.min(20, Math.max(2, X + delta));
  showToast(`Spins to win changed → Current: ${X} spins | Total spins: ${totalSpins}`);
}

function spin() {
  try { getCtx().resume(); } catch (e) {}
  if (!audioCtx) getCtx();
  if (isSpinning) return;

  isSpinning = true;
  hasWon = false;
  spinning = [true, true, true];
  totalSpins++;

  startTickLoop();

  const willWin = totalSpins % X === 0;
  let targets;

  if (willWin) {
    const winIndex = Math.floor(Math.random() * 10);
    targets = [winIndex, winIndex, winIndex];
  } else {
    const winIndex = Math.floor(Math.random() * 10);
    let loseIndex = Math.floor(Math.random() * 10);
    while (loseIndex === winIndex) {
      loseIndex = Math.floor(Math.random() * 10);
    }
    targets = [winIndex, winIndex, loseIndex];
  }

  render();

  // Reel 1 stop
  setTimeout(() => {
    spinning[0] = false;
    positions[0] = targets[0];
    thunkSfx();
    render();
  }, 1000);

  // Reel 2 stop
  setTimeout(() => {
    spinning[1] = false;
    positions[1] = targets[1];
    thunkSfx();
    render();
  }, 1700);

  // Reel 3 stop + win check
  setTimeout(() => {
    spinning[2] = false;
    positions[2] = targets[2];
    isSpinning = false;
    stopTickLoop();
    thunkSfx();

    hasWon = willWin;

    if (willWin) {
      totalSpins = 0; // reset to 0 on win
      winJingle();
    } else {
      setTimeout(() => loseSfx(), 120);
    }

    render();

    if (!willWin) {
      setTimeout(() => {
        hasWon = false;
        render();
      }, 400);
    }
  }, 2400);
}

// Init
render();
</script>

</body>
</html>
