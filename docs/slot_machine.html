<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nike - Slot Machine</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{font-family:"Plus Jakarta Sans", system-ui, sans-serif}
  @keyframes scrollVertical{0%{transform:translateY(0)}100%{transform:translateY(-1000px)}}
  @keyframes jackpotPop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}30%{transform:translate(-50%,-50%) scale(1.08);opacity:1}50%{transform:translate(-50%,-50%) scale(.96)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(.6);opacity:0}}
  .reel-bounce{transition:transform .64s cubic-bezier(.34,1.56,.64,1)}
  .reel-spinning{animation:scrollVertical .48s linear infinite}
  :root{
    /* ===== EDIT THESE COLORS ===== */
    --app-bg: #ffffff;          /* APP WINDOW - white */          /* app window background (not whole website) */
    --spin-bg: #111111;         /* SPIN BUTTON - black */         /* spin button background */
    --spin-text: #ffffff;       /* spin button text */
    --spin-shadow: rgba(0,0,0,0.28);
    --payline: #111111;         /* middle line color */
  }
  .bg-fallback{ background-color:#ffffff; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden relative bg-fallback" id="pageBody">
<div id="bgLayer" class="pointer-events-none absolute inset-0">
  <div id="bgFallback" class="absolute inset-0">
    <div class="absolute -top-[10%] right-[-6%] w-[68%] max-w-[620px] h-[52%] bg-[#e9ecef] rounded-[60%_40%_50%_50%/60%_50%_50%_40%] opacity-90 rotate-[-6deg]"></div>
    <div class="absolute top-[14%] right-[18%] w-[180px] h-[180px] bg-white rounded-full shadow-[0_20px_60px_rgba(0,0,0,0.04)] opacity-70"></div>
    <div class="absolute -bottom-[12%] left-[-6%] w-[68%] max-w-[620px] h-[48%] bg-[#eef1f3] rounded-[40%_60%_60%_40%/60%_40%_40%_60%] opacity-90"></div>
  </div>
  <img id="bgImage" class="absolute inset-0 w-full h-full object-cover hidden" alt="background"/>
</div>

<!-- FULL-SCREEN CONFETTI - on top of everything including YOU WIN -->
<div id="globalConfetti" class="pointer-events-none fixed inset-0 z-[100] overflow-hidden"></div>

<!-- origin-center + scale for zoom - edit scale-[1.5] to zoom in/out -->
<div id="app" class="relative z-10 w-full max-w-[400px] flex flex-col items-center scale-[1.1] origin-center"></div>

<script>
const ASSETS = {
  background: "assets/background.jpg",
  frame: "assets/frame.png",
  logo: "assets/logo.png",
  jackpot: "assets/jackpot.png",
  icons: [
    "assets/icon-0.png","assets/icon-1.png","assets/icon-2.png","assets/icon-3.png","assets/icon-4.png",
    "assets/icon-5.png","assets/icon-6.png","assets/icon-7.png","assets/icon-8.png","assets/icon-9.png",
  ]
};
const FALLBACK_ICONS = [
  {e:'🍒'},{e:'🍋'},{e:'🔔'},{e:'🍀'},{e:'💎'},{e:'7️⃣'},{e:'⭐'},{e:'🍉'},{e:'👑'},{e:'💰'}
];
let bgLoaded=false, frameLoaded=false, logoLoaded=false, jackpotLoaded=false;
let iconLoaded = Array(10).fill(false);
function tryLoadImage(src,onOk,onFail){
  const img=new Image(); img.onload=onOk; img.onerror=onFail; img.src=src+"?v="+Date.now();
}
tryLoadImage(ASSETS.background,()=>{
  bgLoaded=true; const bgImg=document.getElementById('bgImage'); const bgFall=document.getElementById('bgFallback');
  bgImg.src=ASSETS.background; bgImg.classList.remove('hidden'); bgFall.classList.add('hidden');
  document.getElementById('pageBody').classList.remove('bg-fallback');
},()=>{});
tryLoadImage(ASSETS.frame,()=>{frameLoaded=true; render();},()=>{});
tryLoadImage(ASSETS.logo,()=>{logoLoaded=true; render();},()=>{});
tryLoadImage(ASSETS.jackpot,()=>{jackpotLoaded=true; render();},()=>{});
ASSETS.icons.forEach((src,i)=>{ tryLoadImage(src,()=>{iconLoaded[i]=true; render();},()=>{}); });

// SFX
let audioCtx=null, tickInterval=null;
function getCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(f,d,t='sine',v=0.25){ try{ const c=getCtx(); const o=c.createOscillator(); const g=c.createGain(); o.type=t; o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d); o.start(); o.stop(c.currentTime+d);}catch(e){} }
function clickSfx(){ tone(900,0.08,'square',0.12); }
function thunkSfx(){ try{ const c=getCtx(); const o=c.createOscillator(); const g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,c.currentTime); o.frequency.exponentialRampToValueAtTime(60,c.currentTime+0.18); g.gain.setValueAtTime(0.4,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.2); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.22); setTimeout(()=>tone(1200,0.05,'triangle',0.12),10);}catch(e){} }
function startTickLoop(){ stopTickLoop(); let s=70; tickInterval=setInterval(()=>tone(1800+Math.random()*400,0.04,'square',0.06),s); let a=0; const slow=setInterval(()=>{ a++; if(tickInterval){ clearInterval(tickInterval); s=Math.min(140,70+a*4); tickInterval=setInterval(()=>tone(1800+Math.random()*400,0.04,'square',0.06),s);} if(!isSpinning){ clearInterval(slow); stopTickLoop(); }},120); tickInterval._slow=slow; }
function stopTickLoop(){ if(tickInterval){ clearInterval(tickInterval); if(tickInterval._slow) clearInterval(tickInterval._slow); tickInterval=null; } }
function winJingle(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>tone(f,0.35,'triangle',0.28),i*120)); setTimeout(()=>tone(1318.5,0.6,'triangle',0.32),500); }
function loseSfx(){ tone(220,0.2,'sine',0.18); }

const ICON_H=100, VIEW_H=240, CENTER_OFFSET=VIEW_H/2-ICON_H/2;
let X=5, totalSpins=0, spinning=[false,false,false], positions=[0,0,0], isSpinning=false, hasWon=false, toastTimer=null;

function renderIconContent(idx){
  const src=ASSETS.icons[idx];
  if(iconLoaded[idx]) return `<img src="${src}" class="w-[68px] h-[68px] object-contain" draggable="false" onerror="iconLoaded[${idx}]=false; this.outerHTML='<span class=\'text-[36px]\'>${FALLBACK_ICONS[idx].e}</span>'" />`;
  else return `<span class="text-[36px]">${FALLBACK_ICONS[idx].e}</span>`;
}
function render(){
  const app=document.getElementById('app');
  const reels=[0,1,2].map(i=>{
    const strip=[...Array(10).keys(), ...Array(10).keys()];
    const trans=spinning[i] ? '' : `translateY(${-positions[i]*ICON_H + CENTER_OFFSET}px)`;
    return `<div class="relative w-[100px] h-[240px] overflow-hidden rounded-[16px] bg-white border border-zinc-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
      <div class="${spinning[i]?'reel-spinning':'reel-bounce'} flex flex-col will-change-transform" style="${spinning[i]?'':`transform:${trans}`}">
        ${strip.map((iconIdx)=>`<div class="flex h-[100px] w-[100px] shrink-0 items-center justify-center select-none bg-white border-b border-zinc-100">${renderIconContent(iconIdx)}</div>`).join('')}
      </div>
      <div class="pointer-events-none absolute inset-x-0 top-0 h-[72px] bg-gradient-to-b from-white via-white/90 to-transparent z-10"></div>
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-[72px] bg-gradient-to-t from-white via-white/90 to-transparent z-10"></div>
    </div>`;
  }).join('');

  // APP BACKGROUND COLOR - uses CSS var --app-bg, falls back if frame image exists
  const appBg = getComputedStyle(document.documentElement).getPropertyValue('--app-bg').trim() || '#ffffff';
  const spinBg = getComputedStyle(document.documentElement).getPropertyValue('--spin-bg').trim() || '#111111';
  const paylineColor = getComputedStyle(document.documentElement).getPropertyValue('--payline').trim() || '#111111';

  const frameStyle = frameLoaded ? `background-image:url('${ASSETS.frame}'); background-size:100% 100%; background-repeat:no-repeat; background-color:transparent; border:none; box-shadow:none;` : `background:${appBg};`;
  const frameInnerClass = frameLoaded ? 'bg-transparent' : 'border border-black/[0.06] shadow-[0_10px_40px_rgba(0,0,0,0.08)]';

  app.innerHTML = `
  <div class="relative w-full rounded-[32px] ${frameInnerClass} p-[10px] md:p-[12px] pt-[6px] md:pt-[8px]" style="${frameStyle}">
    ${frameLoaded ? `<div class="absolute inset-0 rounded-[32px] -z-10" style="background:${appBg}; opacity:0.85"></div>` : ''}

    <div class="relative flex min-h-[48px] items-center justify-center rounded-[16px] bg-transparent py-[2px]">
      ${logoLoaded ? `<img src="${ASSETS.logo}" class="h-[84px] md:h-[108px] max-w-[340px] w-auto object-contain" alt="logo" style="transform:scale(1.15)" onerror="logoLoaded=false; render();" />` : `<div class="flex h-[72px] w-[320px] items-center justify-center rounded-2xl border border-dashed border-zinc-300/60 text-[11px] font-bold tracking-[0.2em] text-zinc-400/80 select-none bg-transparent">YOUR LOGO HERE</div>`}
      <button onclick="changeX(-1)" title="S1" class="absolute left-[6px] top-1/2 -translate-y-1/2 h-[12px] w-[12px] rounded-full bg-zinc-300 opacity-[0.18] hover:opacity-[0.7] hover:bg-zinc-400 active:scale-90 z-20"></button>
      <button onclick="changeX(1)" title="S2" class="absolute right-[6px] top-1/2 -translate-y-1/2 h-[12px] w-[12px] rounded-full bg-zinc-300 opacity-[0.18] hover:opacity-[0.7] hover:bg-zinc-400 active:scale-90 z-20"></button>
    </div>

    <div id="toast" class="pointer-events-none absolute left-1/2 top-[18px] z-30 -translate-x-1/2 whitespace-nowrap rounded-full border border-black/[0.06] bg-white px-4 py-[9px] text-[11px] font-medium text-zinc-700 shadow-[0_8px_24px_rgba(0,0,0,0.08)] hidden">
      <span class="mr-2 inline-block h-[6px] w-[6px] rounded-full" style="background:${paylineColor}"></span><span id="toastText"></span>
    </div>

    <div class="mt-[6px] rounded-[24px] border border-black/[0.03] p-[12px]" style="background:${appBg === '#ffffff' ? '#f5f7f9' : appBg}ee;">
      <div class="relative flex justify-center gap-[10px] rounded-[16px] py-[6px]">
        <div class="pointer-events-none absolute left-[2px] right-[2px] top-1/2 z-20 h-[2px] -translate-y-1/2" style="background:${paylineColor}; box-shadow:0 0 12px ${paylineColor}55"></div>
        <div class="pointer-events-none absolute left-[2px] right-[2px] top-1/2 z-20 h-[28px] -translate-y-1/2 blur-[1px]" style="background:${paylineColor}0f;"></div>
        ${reels}
        ${hasWon ? `
          <div class="pointer-events-none absolute inset-0 z-20 rounded-[16px]" style="background:radial-gradient(ellipse at center, ${paylineColor}1a, transparent 70%)"></div>
          <div class="absolute left-1/2 top-1/2 z-40 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="animation:jackpotPop .62s cubic-bezier(.34,1.56,.64,1) forwards">
            ${jackpotLoaded ? `<img src="${ASSETS.jackpot}" class="max-w-[420px] max-h-[240px] w-[90vw] object-contain drop-shadow-[0_12px_32px_rgba(0,0,0,0.4)]" alt="YOU WIN" onerror="jackpotLoaded=false; render();" />` : `<div class="whitespace-nowrap rounded-full px-10 py-4 text-[36px] md:text-[44px] font-[800] tracking-[0.02em] text-white shadow-[0_12px_32px_rgba(0,0,0,0.45)] border border-white/10" style="background:${paylineColor}">YOU WIN!</div>`}
          </div>
        `:''}
      </div>
    </div>

    <div class="mt-[18px] flex flex-col items-center pb-[4px]">
      <button id="spinBtn" onclick="spin()" ${isSpinning?'disabled':''} class="relative h-[52px] w-[168px] select-none rounded-full text-[14px] font-[800] tracking-[0.14em] outline-none transition-all ${isSpinning?'opacity-70 cursor-not-allowed':'active:scale-[0.98] hover:brightness-[1.08] cursor-pointer'}" style="background:var(--spin-bg); color:var(--spin-text); box-shadow:0 6px 16px var(--spin-shadow), 0 1px 0 rgba(255,255,255,0.15) inset">
        ${isSpinning?'SPINNING...':'SPIN'}
      </button>
    </div>
  </div>`;

  if(hasWon){
    // Full-screen confetti on top of YOU WIN, covers whole screen, lasts 3s
    const cEl=document.getElementById('globalConfetti');
    if(cEl){
      let h='';
      const colors=['#111111','#ffffff','#ff6900','#e5e7eb','#a3a3a3'];
      for(let i=0;i<90;i++){
        const left = Math.random()*100;
        const delay = Math.random()*0.4;
        const dur = 2.2 + Math.random()*1.2; // 2.2-3.4s => lasts ~3s
        const sizeW = 6 + Math.random()*6;
        const sizeH = 8 + Math.random()*10;
        const rot = Math.random()*720;
        h+=`<div class="absolute rounded-[2px]" style="left:${left}%; top:-20px; width:${sizeW}px; height:${sizeH}px; background:${colors[i%colors.length]}; animation:confettiFall ${dur}s cubic-bezier(.25,.46,.45,.94) forwards; animation-delay:${delay}s; transform:rotate(${rot}deg)"></div>`;
      }
      cEl.innerHTML=h;
      // clear after 3s
      setTimeout(()=>{ if(cEl) cEl.innerHTML=''; }, 3000);
    }
  } else {
    // ensure confetti cleared when not winning
    const gc=document.getElementById('globalConfetti');
    if(gc && !hasWon) { /* keep if timeout will clear */ }
  }
}
function showToast(msg){
  const t=document.getElementById('toast'); const tt=document.getElementById('toastText'); if(!t) return;
  tt.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.classList.add('hidden'); },3000);
}
function changeX(d){ try{ getCtx().resume(); }catch(e){} clickSfx(); X=Math.min(20,Math.max(2,X+d)); showToast(`Spins to win changed → Current: ${X} spins | Total spins: ${totalSpins}`); }
function spin(){
  try{ getCtx().resume(); }catch(e){} if(!audioCtx) getCtx(); if(isSpinning) return;
  isSpinning=true; hasWon=false; spinning=[true,true,true]; totalSpins++; startTickLoop();
  const willWin=totalSpins % X === 0; let targets;
  if(willWin){ const w=Math.floor(Math.random()*10); targets=[w,w,w]; } else { const w=Math.floor(Math.random()*10); let l=Math.floor(Math.random()*10); while(l===w) l=Math.floor(Math.random()*10); targets=[w,w,l]; }
  render();
  setTimeout(()=>{ spinning[0]=false; positions[0]=targets[0]; thunkSfx(); render(); },1000);
  setTimeout(()=>{ spinning[1]=false; positions[1]=targets[1]; thunkSfx(); render(); },1700);
  setTimeout(()=>{ 
    spinning[2]=false; positions[2]=targets[2]; isSpinning=false; stopTickLoop(); thunkSfx(); 
    hasWon=willWin; 
    if(willWin){
      totalSpins = 0; // reset to 0 on win
      winJingle();
    } else {
      setTimeout(()=>loseSfx(),120);
    }
    render(); 
    if(!willWin) setTimeout(()=>{ hasWon=false; render(); },400); 
  },2400);
}
render();
</script>
</body>
</html>
