<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booth Video Test</title>
<style>
  /* --- Basic reset --- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: sans-serif;
    background: #111;
    color: white;
    overflow: hidden; /* no scroll for booth */
  }

  /* --- This is the magic for fullscreen overlays --- */
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* --- START OVERLAY --- */
  #start-overlay {
    background: #1a1a1a;
    z-index: 20; /* on top first */
  }
  #start-overlay h1 {
    font-size: 2rem;
    margin-bottom: 20px;
    opacity: 0.8;
  }
  #play-btn {
    padding: 20px 50px;
    font-size: 1.5rem;
    font-weight: bold;
    border: none;
    border-radius: 100px;
    background: white;
    color: black;
    cursor: pointer;
  }
  #play-btn:hover { transform: scale(1.05); }

  /* --- VIDEO OVERLAY (fullscreen) --- */
  #video-overlay {
    background: black; /* letterbox color for vertical video */
    display: none; /* hidden at start */
    z-index: 15;
  }

  /* The video itself - as big as possible, no pause */
  #video-overlay video {
    width: 100vw;
    height: 100vh;
    /* contain = show whole vertical video, with black space on sides */
    /* if you want it to crop and fill, change to 'cover' */
    object-fit: contain; 
    pointer-events: none; /* prevents click to pause */
  }

  /* Simple close button on video */
  #close-video-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 30;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 100px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 1rem;
  }
  #close-video-btn:hover { background: rgba(255,255,255,0.3); }

  /* Hint text */
  .hint {
    position: absolute;
    bottom: 30px;
    opacity: 0.5;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <!-- OVERLAY 1: START SCREEN -->
  <div id="start-overlay" class="overlay">
    <h1>Booth Video Test</h1>
    <button id="play-btn">▶ Play Video</button>
    <p class="hint">Put test_video.mp4 in same folder as this file</p>
  </div>

  <!-- OVERLAY 2: VIDEO SCREEN (fullscreen) -->
  <div id="video-overlay" class="overlay">
    <button id="close-video-btn">✕ Close</button>
    <!-- Video player - NO CONTROLS so people can't pause -->
    <video id="main-video" playsinline
           disablePictureInPicture
           controlsList="nodownload noplaybackrate noremoteplayback">
      <!-- Your file -->
      <source src="test_video.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
  </div>

<script>
  // --- Get elements ---
  const startOverlay = document.getElementById('start-overlay');
  const videoOverlay = document.getElementById('video-overlay');
  const playBtn = document.getElementById('play-btn');
  const closeBtn = document.getElementById('close-video-btn');
  const video = document.getElementById('main-video');

  // --- When user presses "Play Video" ---
  playBtn.addEventListener('click', () => {
    // 1. Hide start screen
    startOverlay.style.display = 'none';
    // 2. Show video screen
    videoOverlay.style.display = 'flex';
    // 3. Play video WITH SOUND (allowed because user just clicked)
    video.muted = false;
    video.currentTime = 0;
    video.play();
  });

  // --- When video finishes, go back to start ---
  video.addEventListener('ended', () => {
    videoOverlay.style.display = 'none';
    startOverlay.style.display = 'flex';
  });

  // --- Close button ---
  closeBtn.addEventListener('click', () => {
    video.pause();
    videoOverlay.style.display = 'none';
    startOverlay.style.display = 'flex';
  });

  // --- Optional: Press ESC to close ---
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && videoOverlay.style.display === 'flex') {
      closeBtn.click();
    }
  });
</script>

</body>
</html>
